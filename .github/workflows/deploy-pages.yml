name: Сборка и публикация Игротеки на GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: Установка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сборка автономной витрины dist/
        run: python -m tools.publish

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5

      - name: Упаковка артефакта dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Публикация на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
